# NexusCAN CI — security remediation plan v0.1 (WP-4 HIL evidence, WP-8 CI gates).
#
# Security regression: no separate job. `cargo test --workspace` already runs the hostile-input
# (netdb/trace parsers), Panic Stop latch (mock0 + vcan0 HIL), listen-only honesty and IPC
# hardening tests; the dedicated `diag_tap_alloc` step covers the feature-gated LOW-01 test.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: rustfmt (root workspace + src-tauri + fuzz crates)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          (cd src-tauri && cargo fmt --check)
          (cd crates/nexus-hal/fuzz && cargo fmt --check)
          (cd crates/nexus-netdb/fuzz && cargo fmt --check)

      # Real SocketCAN HIL (vcan0): Panic Stop wire race, diag HIL. Best effort — if the
      # runner kernel has no vcan module the HIL tests print SKIP instead of failing.
      - name: Set up vcan0 (Linux, best effort)
        if: runner.os == 'Linux'
        run: |
          if sudo modprobe vcan 2>/dev/null \
             || { sudo apt-get update -q \
                  && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" \
                  && sudo modprobe vcan; }; then
            sudo ip link add dev vcan0 type vcan
            sudo ip link set vcan0 mtu 72
            sudo ip link set up vcan0
            ip -details link show vcan0
            echo "NEXUS_REQUIRE_VCAN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::vcan kernel module unavailable; vcan0 HIL tests will SKIP"
          fi

      - name: Clippy (workspace, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test diag tap allocation (test-hooks feature)
        run: cargo test -p nexus-hal --features test-hooks --test diag_tap_alloc

  tauri:
    name: tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            build-essential file patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri is a separate cargo workspace with its own Cargo.lock; it depends on the
      # root crates by path, so both lockfiles feed the cache key.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          key: tauri

      - name: npm ci
        run: npm ci

      - name: Type-check frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Frontend unit tests (every npm test:* script)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for s in $(node -e 'console.log(Object.keys(require("./package.json").scripts).filter(k=>k.startsWith("test:")).join(" "))'); do
            echo "::group::$s"; npm run -s "$s"; echo "::endgroup::"
          done

      # `tauri::generate_context!` needs `frontendDist` (../dist) at compile time.
      - name: Build frontend
        run: npm run build

      - name: Test src-tauri
        working-directory: src-tauri
        run: cargo test

      # 3-OS package build (unsigned), using the @tauri-apps/cli devDependency from package-lock.
      - name: Package (tauri build)
        run: npm run tauri -- build --ci

      - uses: actions/upload-artifact@v7
        with:
          name: nexuscan-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

      # Release assets (push to main only): pick the user-facing installers / portable binaries out of
      # the bundle tree (which also holds intermediate AppDir / .app folders) into one flat directory.
      - name: Collect release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          B=src-tauri/target/release/bundle
          OUT=release-assets
          mkdir -p "$OUT"
          case "$RUNNER_OS" in
            Linux)
              cp "$B"/appimage/*.AppImage "$B"/deb/*.deb "$B"/rpm/*.rpm "$OUT"/
              chmod +x "$OUT"/*.AppImage
              ;;
            Windows)
              cp "$B"/msi/*.msi "$B"/nsis/*-setup.exe "$OUT"/
              # Portable: runs without installing (needs the WebView2 runtime, preinstalled on Win 10/11).
              cp src-tauri/target/release/nexuscan-tauri.exe "$OUT/NexusCAN_${VERSION}_x64_portable.exe"
              ;;
            macOS)
              cp "$B"/dmg/*.dmg "$OUT"/
              ;;
          esac
          ls -la "$OUT"

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  # Publishes a GitHub Release with ready-to-run binaries for every push to main, but only after the
  # full rust + tauri gate is green on all three OSes (no second build: reuses the tauri job's bundles).
  release:
    name: release (GitHub Releases)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, tauri]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          SHORT=$(git rev-parse --short HEAD)
          cat > notes.md <<EOF
          NexusCAN ${VERSION}, build ${GITHUB_RUN_NUMBER} (commit ${SHORT}), all CI gates passed on Linux / Windows / macOS.

          | Platform | File |
          | :--- | :--- |
          | Windows 10/11 x64 | \`*_x64-setup.exe\` (installer), \`*_x64_en-US.msi\`, \`*_x64_portable.exe\` (no install) |
          | Linux x86_64 | \`*.AppImage\` (\`chmod +x\` and run), \`*.deb\`, \`*.rpm\` |
          | macOS Apple Silicon | \`*_aarch64.dmg\` |

          Builds are unsigned: Windows SmartScreen asks "Run anyway"; on macOS run
          \`xattr -cr /Applications/NexusCAN.app\` once after copying the app.
          Verify downloads with \`SHA256SUMS.txt\`.
          EOF
          gh release create "$TAG" dist-release/* \
            --target "$GITHUB_SHA" \
            --title "NexusCAN ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --latest

  fuzz-smoke:
    name: fuzz-smoke (nightly, 60 s/target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/nexus-netdb/fuzz -> target
            crates/nexus-hal/fuzz -> target
          key: fuzz
          cache-all-crates: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz nexus-netdb targets
        working-directory: crates/nexus-netdb
        run: |
          set -euo pipefail
          for t in $(cargo +nightly fuzz list); do
            echo "::group::nexus-netdb/$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60
            echo "::endgroup::"
          done

      - name: Fuzz nexus-hal targets (if present)
        run: |
          set -euo pipefail
          if [ -d crates/nexus-hal/fuzz ]; then
            cd crates/nexus-hal
            for t in $(cargo +nightly fuzz list); do
              echo "::group::nexus-hal/$t"
              cargo +nightly fuzz run "$t" -- -max_total_time=60
              echo "::endgroup::"
            done
          else
            echo "crates/nexus-hal/fuzz not present; skipping"
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            crates/nexus-netdb/fuzz/artifacts/
            crates/nexus-hal/fuzz/artifacts/
          if-no-files-found: ignore
