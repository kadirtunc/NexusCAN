[package]
name = "nexuscan-tauri"
version = "0.1.0"
description = "NexusCAN — Industrial CAN / CAN-FD Bus Analyzer & Telemetry Platform"
authors = ["NexusCAN Engineering Team"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[workspace]

[lib]
name = "nexuscan_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core = { path = "../crates/nexus-core" }
nexus-netdb = { path = "../crates/nexus-netdb" }
nexus-hal = { path = "../crates/nexus-hal" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync"] }
