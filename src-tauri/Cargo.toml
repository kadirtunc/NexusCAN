[package]
name = "nexuscan-tauri"
version = "0.1.0"
description = "NexusCAN — Industrial CAN / CAN-FD Bus Analyzer & Telemetry Platform"
authors = ["NexusCAN Engineering Team"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[workspace]

[lib]
name = "nexuscan_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core = { path = "../crates/nexus-core" }
nexus-netdb = { path = "../crates/nexus-netdb" }
nexus-hal = { path = "../crates/nexus-hal" }
nexus-protocols = { path = "../crates/nexus-protocols" }
# In-app read-only MCP server (Streamable HTTP on 127.0.0.1, off by default).
nexus-mcp = { path = "../crates/nexus-mcp" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros"] }

# WP-8 / LOW-01: hardened release profile for the shipped desktop binary.
[profile.release]
# Kept as unwind: command bodies run in `spawn_blocking`; a panic there (e.g. a parser bug on a
# malformed trace/DBC) surfaces as a `JoinError` -> IPC error instead of aborting the process
# while a bus may be armed. No code relies on `catch_unwind` directly.
panic = "unwind"
# Cross-crate inlining of the hot path (HAL -> StateTable -> snapshot) at moderate link cost.
lto = "thin"
# Best optimization / smallest binary; release builds are not latency-critical to compile.
codegen-units = 1
# Do not ship symbol tables (smaller artifacts, less reverse-engineering surface); panics still
# print messages, just without symbolized backtraces.
strip = "symbols"
# Integer overflow panics instead of silently wrapping (DLC / bit offsets / counters coming from
# untrusted files and buses). Cost is negligible next to IPC + rendering.
overflow-checks = true
debug = false
