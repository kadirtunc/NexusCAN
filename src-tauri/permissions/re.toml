# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "re"
description = "RE Toolkit R1 (re-toolkit-v1 §2.1), passive only: start / stop / reset the reverse-engineering sniffer, set the free / baseline / action phase, event markers, the 10 Hz binary heatmap snapshot subscription, per-row detail and the on-demand field classifier; R2a Signal Inspector (§6): focus rings, candidate / reference series (binary), correlation sweep, OBD-II reference decoded from bus traffic; R2b (§7.3): DBC text generation for found-signal drafts (pure, optional base64 base database, no file system writes); R2c (§8.3): value scan over RE bit fields (first / next / undo / reset / status / paged results; CPU-bound on blocking workers, 2 s budget). No bus TX path."
permissions = [
  "allow-cmd-re-start",
  "allow-cmd-re-stop",
  "allow-cmd-re-reset",
  "allow-cmd-re-set-phase",
  "allow-cmd-re-mark",
  "allow-cmd-re-markers",
  "allow-cmd-re-subscribe",
  "allow-cmd-re-row-detail",
  "allow-cmd-re-classify",
  "allow-cmd-re-focus-set",
  "allow-cmd-re-focus-status",
  "allow-cmd-re-series",
  "allow-cmd-re-correlate",
  "allow-cmd-re-dbc-generate",
  "allow-cmd-re-scan-first",
  "allow-cmd-re-scan-next",
  "allow-cmd-re-scan-undo",
  "allow-cmd-re-scan-reset",
  "allow-cmd-re-scan-status",
  "allow-cmd-re-scan-results",
]
