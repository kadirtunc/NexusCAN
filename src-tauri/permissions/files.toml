# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "files"
description = "Project and trace storage under the app data directory: save / load / delete projects and traces, stateless parsing of imported trace content and BLF export."
permissions = [
  "allow-cmd-save-project",
  "allow-cmd-load-project",
  "allow-cmd-delete-project",
  "allow-cmd-save-trace-file",
  "allow-cmd-load-trace-file",
  "allow-cmd-delete-trace-file",
  "allow-cmd-parse-trace-content",
  "allow-cmd-export-trace-blf",
]
