# ECU reprogramming permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "flash"
description = "ECU reprogramming: load / release firmware images (Intel HEX, S-record, binary) and run / cancel UDS downloads (0x34/0x36/0x37) over an armed diag session."
permissions = [
  "allow-cmd-flash-load-image",
  "allow-cmd-flash-release-image",
  "allow-cmd-flash-download",
  "allow-cmd-flash-cancel",
]
