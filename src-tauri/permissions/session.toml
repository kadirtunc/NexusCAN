# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "session"
description = "Passive session control (no bus TX): connect / disconnect buses (always Listen-Only on open), reset session, load / parse / bind signal databases from IPC payloads, reset telemetry, and offline trace replay (replay to hardware stays gated by the engine's arm + Panic Stop latch)."
permissions = [
  "allow-cmd-connect-bus",
  "allow-cmd-disconnect-bus",
  "allow-cmd-disconnect-all-buses",
  "allow-cmd-reset-session",
  "allow-cmd-load-preset-databases",
  "allow-cmd-load-database-content",
  "allow-cmd-parse-database-schema",
  "allow-cmd-set-bus-databases",
  "allow-cmd-clear-database",
  "allow-cmd-reset-telemetry",
  "allow-cmd-start-trace-replay",
  "allow-cmd-control-trace-replay",
  "allow-cmd-append-debug-event",
  "allow-cmd-clear-debug-events",
  "allow-cmd-set-debug-window-open",
  "allow-cmd-trace-window",
]
