# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "diagnostics"
description = "UDS / ISO-TP diagnostics: sessions, raw UDS requests, DID / DTC reads, 0x19 DTC reports, TesterPresent, conversation and ISO-TP monitor pages, functional ECU discovery, passive (TX-free) ECU discovery, armed physical sweeps, ad-hoc seed/key computation (portable providers in-process; native library / external-process providers out-of-process) and seed/key library probing."
permissions = [
  "allow-cmd-diag-open-session",
  "allow-cmd-diag-close-session",
  "allow-cmd-diag-session-info",
  "allow-cmd-diag-send-uds",
  "allow-cmd-diag-read-did",
  "allow-cmd-diag-read-stored-dtcs",
  "allow-cmd-diag-set-tester-present",
  "allow-cmd-diag-get-conversation",
  "allow-cmd-diag-discover-ecus",
  "allow-cmd-diag-get-isotp-frames",
  "allow-cmd-diag-read-dtc-report",
  "allow-cmd-diag-passive-discovery-start",
  "allow-cmd-diag-passive-discovery-snapshot",
  "allow-cmd-diag-passive-discovery-stop",
  "allow-cmd-diag-physical-sweep",
  "allow-cmd-seedkey-compute-adhoc",
  "allow-cmd-seedkey-probe-library",
]
