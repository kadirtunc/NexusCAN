# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "workspace"
description = "Diagnostics Workspace storage under the app data directory (diag-workspace-v1 §9 / §10): flow library list / revisions / load / save (immutable revisions) / soft delete, and the append-only run store (append, query, latest per ECU and flow). No bus access; nothing is ever overwritten or hard-deleted."
permissions = [
  "allow-cmd-flowlib-list",
  "allow-cmd-flowlib-revisions",
  "allow-cmd-flowlib-load",
  "allow-cmd-flowlib-save",
  "allow-cmd-flowlib-delete",
  "allow-cmd-run-append",
  "allow-cmd-run-query",
  "allow-cmd-run-latest",
]
