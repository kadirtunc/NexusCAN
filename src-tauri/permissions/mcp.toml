# MCP permission set. `allow-<cmd>` permissions are autogenerated by tauri-build from
# `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs).
[[set]]
identifier = "mcp"
description = "In-app MCP server control: start (127.0.0.1 only, bearer token), stop and status, plus the UI co-pilot bridge (attach / respond). MCP data tools are read-only (database, trace, project and debug-event inspection). The ui_* tools may change what the NexusCAN window displays (view, selection, trace filter, plotted signals, notifications, confirm dialogs) but never change bus or data state: no tool can transmit, arm a bus, change bus mode, load/save files or start a replay."
permissions = [
  "allow-cmd-mcp-start",
  "allow-cmd-mcp-stop",
  "allow-cmd-mcp-status",
  "allow-cmd-mcp-ui-attach",
  "allow-cmd-mcp-ui-respond",
]
