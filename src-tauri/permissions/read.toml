# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "read"
description = "Read-only state: device list / driver probe, schema and preset catalog, periodic TX job list, project and trace directory listings, seed/key capabilities, and the 60 Hz telemetry subscription."
permissions = [
  "allow-cmd-list-devices",
  "allow-cmd-probe-drivers",
  "allow-cmd-get-current-schema",
  "allow-cmd-get-preset-database-files",
  "allow-cmd-list-periodic-tx",
  "allow-cmd-list-projects",
  "allow-cmd-list-traces",
  "allow-cmd-seedkey-capabilities",
  "allow-cmd-subscribe-telemetry",
]
