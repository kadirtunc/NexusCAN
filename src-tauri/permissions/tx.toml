# WP-8 / HIGH-03 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs; the build fails otherwise).
[[set]]
identifier = "tx"
description = "Active bus access: arm / leave Listen-Only, single-shot and periodic signal / raw TX, stop periodic jobs, Panic Stop and clearing the Panic Stop latch."
permissions = [
  "allow-cmd-arm-active-bus",
  "allow-cmd-set-bus-mode",
  "allow-cmd-transmit-signal-frame",
  "allow-cmd-transmit-raw-frame",
  "allow-cmd-stop-periodic-tx",
  "allow-cmd-panic-stop-tx",
  "allow-cmd-clear-panic-latch",
]
