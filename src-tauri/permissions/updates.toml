# update-check-v1 permission set. `allow-<cmd>` permissions are autogenerated by tauri-build
# from `src/app_commands.rs`; every app command belongs to exactly one set (enforced by build.rs).
[[set]]
identifier = "updates"
description = "GitHub release update check (anonymous read of the public Releases API, check + notify only, no download/install) and opening the whitelisted github.com/kadirtunc/NexusCAN/releases page in the system browser."
permissions = [
  "allow-cmd-get-app-version",
  "allow-cmd-check-for-update",
  "allow-cmd-open-release-page",
]
