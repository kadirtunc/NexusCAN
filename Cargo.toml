[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["NexusCAN Engineering Team"]
repository = "https://github.com/NexusCAN/NexusCAN"

[workspace.dependencies]
# Internal workspace crates
nexus-core = { path = "crates/nexus-core" }
nexus-netdb = { path = "crates/nexus-netdb" }
nexus-hal = { path = "crates/nexus-hal" }
nexus-cloud = { path = "crates/nexus-cloud" }
nexus-protocols = { path = "crates/nexus-protocols" }
nexus-seedkey-native = { path = "crates/nexus-seedkey-native" }
nexus-seedkey-host = { path = "crates/nexus-seedkey-host" }

# Serialization & Core Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
flate2 = "1.1"
thiserror = "2.0"
rustc-hash = "2.1"
indexmap = { version = "2.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde", "const_generics", "union"] }

# Concurrency, Async Runtime & Local Telemetry Port Bridge
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["ws", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
# OS CSPRNG for the dev bridge auth token (WP-1)
getrandom = "0.3"

# Linux Native SocketCAN (used behind target_os = "linux" in nexus-hal)
socketcan = "3.5"
nix = { version = "0.29", features = ["net", "ioctl", "poll", "time"] }

# Cross-OS Serial / USB-CDC Lawicel SLCAN (default-features = false avoids libudev C headers)
serialport = { version = "4.7", default-features = false }

# Cross-OS Driverless USB-CAN (`gs_usb` / `candleLight` via usbfs / WinUSB / IOKit)
nusb = "0.1"
futures-lite = "2.6"

# Network Database Parsing (.dbc / .kcd) & Character Transcoding
winnow = "0.7"
encoding_rs = "0.8"
quick-xml = "0.42"

# UDS SecurityAccess seed/key providers (Rhai in nexus-protocols; libloading in the out-of-process
# nexus-seedkey-host helper; ureq reserved for the future `http` provider)
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module", "no_custom_syntax"] }
libloading = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# UDS client core (D-003): ISO-TP + UDS framing only; NexusCAN HAL provides CAN access. Pinned.
automotive = { version = "=0.6.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
