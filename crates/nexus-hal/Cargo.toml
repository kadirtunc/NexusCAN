[package]
name = "nexus-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexus_bridge"
path = "src/bin/nexus_bridge.rs"

[[test]]
name = "diag_tap_alloc"
path = "tests/diag_tap_alloc.rs"
# WP-8 / LOW-01: needs `pipeline::BUS_IO_THREAD_START_HOOK`, which only exists with the
# `test-hooks` feature (never enabled in release builds).
# Run with: cargo test -p nexus-hal --features test-hooks --test diag_tap_alloc
required-features = ["test-hooks"]

[features]
default = []
# Test-only instrumentation hooks (bus-io thread start hook). Never enable for shipping builds.
test-hooks = []
# Development only (simulator testing): the CANsub driver also trusts the PEM root CA named by
# `NEXUSCAN_CANSUB_DEV_ROOT` (e.g. `cansub-sim --ca-out`). A compile_error! rejects it without
# debug_assertions, so it can never reach a release build.
cansub-dev-root = ["cansub-rs/dev-root"]

[dependencies]
nexus-core = { workspace = true }
nexus-netdb = { workspace = true }
nexus-protocols = { workspace = true }
# Native seed/key providers: out-of-process GenerateKeyEx helper + external programs.
nexus-seedkey-native = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
getrandom = { workspace = true }
serialport = { workspace = true }
nusb = { workspace = true }
futures-lite = { workspace = true }
# PEAK PCAN-Basic is loaded at runtime (missing DLL/SO never prevents startup).
libloading = { workspace = true }
# CSS Electronics CANsub (TLS + REST + WSS, mDNS discovery) — all platforms (contract cansub-v1 §3.4).
cansub-rs = { workspace = true, features = ["blocking", "discovery"] }

[dev-dependencies]
# `sim`: in-process CANsub emulator (`cansub::sim::SimHandle`) + `Device::connect_with_root` for tests.
cansub-rs = { workspace = true, features = ["blocking", "discovery", "sim"] }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { workspace = true }
nix = { workspace = true }

[lints]
workspace = true
