[package]
name = "nexus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone headless CAN / CAN-FD Listen-Only field telemetry agent and DBC/KCD linter for NexusCAN"

[lib]
name = "nexus_cli"
path = "src/lib.rs"

[[bin]]
name = "nexuscan"
path = "src/main.rs"

[dependencies]
nexus-core = { workspace = true }
nexus-netdb = { workspace = true }
nexus-hal = { workspace = true }
nexus-cloud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
axum = { workspace = true }
# CSS Electronics CANsub SDK: `nexuscan cansub-selftest` (contract cansub-v1 §6).
cansub-rs = { workspace = true, features = ["blocking"] }

[dev-dependencies]
# In-process device emulator + `Device::connect_with_root` for the selftest integration test.
cansub-rs = { workspace = true, features = ["blocking", "sim"] }

[lints]
workspace = true
