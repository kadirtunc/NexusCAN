# Değerlendirme denemesi (spike) — ürün kodu DEĞİL.
# Kendi [workspace] tablosu var; root workspace'e karışmaz.
[package]
name = "automotive-eval"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
# Değerlendirilen crate. Sürüm sabit; yalnızca SocketCAN adaptörü açık.
automotive = { version = "=0.6.0", default-features = false, features = ["socketcan"] }
# Seed/key sağlayıcılarımız (Rhai script özelliği gereksiz).
nexus-protocols = { path = "../../crates/nexus-protocols", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde_json = "1"
hex = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
